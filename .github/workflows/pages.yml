# Deploys the benchmark results page (Bench/site, generated and committed by `alloy-bench site`) to GitHub Pages.
# Runs only on the public repository; no build step, the committed page is what was reviewed.
name: Pages

on:
  push:
    branches: [main]
    paths: ['Bench/site/**']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'mburger89/Alloy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Bench/site
      - id: deployment
        uses: actions/deploy-pages@v4
